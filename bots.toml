# --- Candidates ----------------------------------------------------------------------------------
# The engine settings whose Lichess rating estimate/ estimates, by playing them against every bot
# with a `play` search. `go` is the candidate's search; `options` are UCI options.

[candidates.stockfish-19]
command = "stockfish-19"
go = "go movetime 100"

[candidates.stockfish-15]
command = "stockfish-15"
go = "go movetime 100"

[candidates.stockfish-19-1mb]
command = "stockfish-19-1mb"
go = "go movetime 100"
