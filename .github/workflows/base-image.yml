# Builds bot-elo-estimator-base, as a user would after cloning, when its folder changes. The build
# ends with the smoke test, so a green run means every engine answered a search.
name: base image

on:
  pull_request:
    paths:
      - images/base/**
      - build_docker.sh
      - .github/workflows/base-image.yml
  push:
    branches: [main]
    paths:
      - images/base/**
      - build_docker.sh
      - .github/workflows/base-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./build_docker.sh base
